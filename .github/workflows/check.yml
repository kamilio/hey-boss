name: Check
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: cargo test --locked
      - run: HEY_BOSS_TEST_BINARY=target/debug/hey-boss python3 -m unittest tools/test_drain_github_issues.py
      - run: python3 -m unittest tools/test_upgrade_hey_boss.py tools/test_fleet_hey_boss.py
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked --release
      - run: |
          mkdir -p out
          xcrun swiftc -O setup_hey_boss.swift -o out/hey-boss-setup
          xcrun swiftc -O -whole-module-optimization -parse-as-library hey_boss_daemon.swift -o out/hey-boss-daemon
          xcrun swiftc -O -parse-as-library -D HEY_BOSS_AUDIT hey_boss_daemon.swift test_hey_boss.swift -o out/hey-boss-test
          (cd /tmp && "$GITHUB_WORKSPACE/out/hey-boss-test")
          swift package_hey_boss.swift out/hey-boss-daemon "out/Hey Boss.app"
          codesign --verify --strict "out/Hey Boss.app"
          plutil -lint "out/Hey Boss.app/Contents/Info.plist"
      - run: cargo package --locked --allow-dirty
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: cargo test --locked
      - run: HEY_BOSS_TEST_BINARY=target/debug/hey-boss python3 -m unittest tools/test_drain_github_issues.py
      - run: cargo clippy --locked --all-targets -- -D warnings
