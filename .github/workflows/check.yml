name: Check
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: cargo test --locked
      - run: HEY_BOSS_TEST_BINARY=target/debug/hey-boss python3 -m unittest tools/test_drain_github_issues.py
      - run: PYTHONPATH=tools python3 -m unittest tools/test_upgrade_hey_boss.py tools/test_fleet_hey_boss.py tools/test_fleet_subtasks.py tools/test_global_settings_fleet.py tools/test_mobile_issues.py
      - run: python3 tools/test_issue_planning.py
      - run: node tools/test_quick_issue.js && node --check src/issues/web/quick-issue.js
      - run: node tools/test_local_http_crypto.cjs
      - run: node tools/test_fleet_view.js && node tools/test_assigned_agent.js && node --check src/issues/web/fleet.js
      - run: node tools/test_lookup_routes.cjs && node --check src/issues/web/routes.js
      - run: node tools/test_issue_pr_labels.cjs && node tools/test_issue_special_tags.cjs && node --check src/issues/web/app.js
      - run: cargo fmt --check
      - run: node tools/test_mindmap_layout.js && node --check src/issues/web/mindmap-map.js && node --check src/issues/web/mindmap.js
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: |
          mkdir -p out
          xcrun swiftc -O setup_hey_boss.swift -o out/hey-boss-setup
          xcrun swiftc -O -whole-module-optimization -parse-as-library hey_boss_daemon.swift -o out/hey-boss-daemon
          xcrun swiftc -g -Onone -parse-as-library -D HEY_BOSS_AUDIT hey_boss_daemon.swift test_hey_boss.swift -o out/hey-boss-test
          (cd /tmp && HEY_BOSS_CLI_PATH="$GITHUB_WORKSPACE/target/debug/hey-boss" "$GITHUB_WORKSPACE/out/hey-boss-test")
          swift package_hey_boss.swift out/hey-boss-daemon "out/Hey Boss.app"
          codesign --verify --strict "out/Hey Boss.app"
          plutil -lint "out/Hey Boss.app/Contents/Info.plist"
      - run: cargo build --locked --release
      - run: cargo package --locked --allow-dirty --workspace --exclude hey-gh-node
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # The runner owns non-dumpable processes. Health cleanup deliberately refuses
      # to proceed without a complete procfs inspection, so its real-process tests
      # need permission to inspect those processes. Keep other tests unprivileged.
      - run: |
          cargo test --locked -- --skip health::
      - run: |
          sudo env "PATH=$PATH" "RUSTUP_HOME=$HOME/.rustup" "CARGO_HOME=$HOME/.cargo" cargo test --locked --lib health::
      - run: HEY_BOSS_TEST_BINARY=target/debug/hey-boss python3 -m unittest tools/test_drain_github_issues.py
      - run: cargo clippy --locked --all-targets -- -D warnings
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npm test
