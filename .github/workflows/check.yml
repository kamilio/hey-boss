name: Check
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: cargo test --locked
      - run: cargo test --locked -p hey-boss --lib github_http_ -- --ignored --test-threads=1
      - run: HEY_BOSS_TEST_BINARY=target/debug/hey-boss python3 -m unittest tools/test_drain_github_issues.py
      - run: PYTHONPATH=tools python3 -m unittest tools/test_upgrade_hey_boss.py tools/test_fleet_hey_boss.py tools/test_fleet_subtasks.py tools/test_global_settings_fleet.py
      - run: python3 tools/test_skill_transport.py
      - run: node --check src/issues/web/skills.js
      - run: node tools/test_quick_issue.js && node --check src/issues/web/quick-issue.js
      - run: node --test tools/test_merged_prs.cjs
      - run: node tools/test_issue_blocked_types.cjs
      - run: node --test tools/test_issue_assignments.cjs tools/test_assignment_badges.cjs tools/test_assignment_runtime.cjs
      - run: node tools/boss_unassign_checks.mjs
      - run: node tools/test_issue_transfer_controls.cjs
      - run: node tools/test_issue_navigation_exit.cjs
      - run: node tools/test_list_pagination.cjs
      - run: cargo test --locked -p hey-boss --test web_client -- --ignored
      - run: cargo build --locked -p hey-boss --bin hey-boss && cargo test --locked -p hey-boss --example web-fixture -- --ignored
      - run: node tools/test_metadata_mutation.cjs
      - run: node tools/test_fleet_view.js && node tools/test_assigned_agent.js && node --check src/issues/web/fleet.js
      - run: node tools/test_jobs_ui.cjs && node --check src/issues/web/jobs-calendar.js
      - run: node tools/test_issue_pr_labels.cjs && node tools/test_issue_commit_controls.cjs && node tools/test_issue_special_tags.cjs && node --check src/issues/web/app.js
      - run: node tools/test_issue_list_actions.cjs
      - run: node tools/test_project_navigation.cjs
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: |
          mkdir -p out
          xcrun swiftc -target "$(uname -m)-apple-macos15.0" -O setup_hey_boss.swift -o out/hey-boss-setup
          xcrun swiftc -target "$(uname -m)-apple-macos15.0" -O -whole-module-optimization -parse-as-library hey_boss_daemon.swift -o out/hey-boss-daemon
          xcrun swiftc -target "$(uname -m)-apple-macos15.0" -g -Onone -parse-as-library -D HEY_BOSS_AUDIT hey_boss_daemon.swift test_hey_boss.swift -o out/hey-boss-test
          (cd /tmp && HEY_BOSS_CLI_PATH="$GITHUB_WORKSPACE/target/debug/hey-boss" "$GITHUB_WORKSPACE/out/hey-boss-test")
          swift package_hey_boss.swift out/hey-boss-daemon "out/Hey Boss.app"
          codesign --verify --strict "out/Hey Boss.app"
          plutil -lint "out/Hey Boss.app/Contents/Info.plist"
      - run: cargo test --locked -p hey-boss --test desktop_package -- --ignored
      - run: cargo build --locked --release
      - run: cargo package --locked --allow-dirty --workspace
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # The runner owns non-dumpable processes. Health cleanup deliberately refuses
      # to proceed without a complete procfs inspection, so its real-process tests
      # need permission to inspect those processes. Keep other tests unprivileged.
      - run: |
          cargo test --locked -- --skip health::
      - run: cargo test --locked -p hey-boss --lib github_http_ -- --ignored --test-threads=1
      - run: |
          sudo env "PATH=$PATH" "RUSTUP_HOME=$HOME/.rustup" "CARGO_HOME=$HOME/.cargo" cargo test --locked --lib health::
      - run: HEY_BOSS_TEST_BINARY=target/debug/hey-boss python3 -m unittest tools/test_drain_github_issues.py
      - run: cargo clippy --locked --all-targets -- -D warnings
  web-assets:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/web-assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: cargo run --locked
      - run: git diff --exit-code -- src/issues/web && test -z "$(git ls-files --others --exclude-standard src/issues/web)"
        working-directory: .
