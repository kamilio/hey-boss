name: Worker TUI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: worker-tui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked --release
      - run: cargo build --locked
      - run: cargo build --locked --manifest-path ../Cargo.toml
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm ci
      - run: npm run test:terminal
      - run: npm run test:activity
      - run: npm run test:projects
      - run: node tests/integrated-terminal.mjs
      - run: python3 ../tools/worker_title_terminal_checks.py ../target/debug/hey-boss
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: worker-tui-terminal-${{ matrix.os }}
          path: |
            worker-tui/target/terminal-qa
            worker-tui/target/activity-qa
            worker-tui/target/project-tabs-qa
