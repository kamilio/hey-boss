name: Worker TUI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: worker-tui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked --release
      - run: cargo build --locked
      - run: cargo build --locked --manifest-path ../Cargo.toml
      - run: "cargo test --locked --test terminal resume:: -- --ignored"
      - run: python3 ../tools/worker_title_terminal_checks.py ../target/debug/hey-boss
      - name: Check CLI terminal screens
        working-directory: .
        run: |
          cargo build --locked -p hey-gh --bin hey-gh
          cargo build --locked --target-dir target --manifest-path packages/git-shelf/Cargo.toml
          cargo build --locked --target-dir target --manifest-path tools/terminal-checks/Cargo.toml
          for suite in settings project transactions; do
            target/debug/terminal-checks "$suite" target/debug/hey-boss
          done
          target/debug/terminal-checks comments target/debug/hey-gh
          target/debug/terminal-checks shelf target/debug/g target/debug/hey-boss
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: worker-tui-terminal-${{ matrix.os }}
          path: |
            out/terminal-checks
            worker-tui/target/terminal-qa
            worker-tui/target/activity-qa
            worker-tui/target/runtime-qa
            worker-tui/target/resume-qa
            worker-tui/target/project-tabs-qa
            worker-tui/target/tab-order-qa
