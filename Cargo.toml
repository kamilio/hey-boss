[package]
name = "hey-boss"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/kamilio/hey-boss"

description = "Native macOS notifications, Markdown updates, and agent questions"
readme = "README.md"
keywords = ["macos", "notifications", "cli", "agents"]
categories = ["command-line-utilities"]
include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "hey_boss_daemon.swift", "install_hey_boss.swift", "setup_hey_boss.swift", "release_hey_boss.swift", "test_hey_boss.swift", "skills/**"]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2.189"

[profile.release]
lto = true
codegen-units = 1
strip = true
