[package]
name = "hey-boss"
version = "0.1.0"
edition = "2024"
default-run = "hey-boss"
build = "build.rs"
license = "MIT"
repository = "https://github.com/kamilio/hey-boss"

description = "Native macOS notifications, Markdown updates, and agent questions"
readme = "README.md"
keywords = ["macos", "notifications", "cli", "agents"]
categories = ["command-line-utilities"]
include = ["src/**", "tests/**", "docs/**", "tools/*.py", "tools/*.sh", "tools/*.js", "Cargo.toml", "Cargo.lock", "build.rs", "README.md", "LICENSE", "CONTRIBUTING.md", "SECURITY.md", "hey_boss_daemon.swift", "package_hey_boss.swift", "assets/**", "install_hey_boss.swift", "setup_hey_boss.swift", "release_hey_boss.swift", "test_hey_boss.swift", "skills/**"]

[dependencies]
crossterm = "0.28"
ratatui = "0.29"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
libc = "0.2.189"
pulldown-cmark = "0.13.1"
base64 = "0.22.1"
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
socket2 = "0.6"
tiny_http = "0.12"
linkify = "0.11.0"
ctrlc = { version = "3.5.2", features = ["termination"] }
html-escape = "0.2"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
