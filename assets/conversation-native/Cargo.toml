[package]
name = "hey-boss-conversation"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
safe-bash-rust = { git = "https://github.com/poe-platform/poe-code", branch = "main" }
poe-agent-rust = { git = "https://github.com/poe-platform/poe-code", branch = "main" }
anyhow = "1"
base64 = "0.22"
futures-util = "0.3"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde_json = "1"
serde_yaml_ng = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "io-std", "macros", "net", "process", "rt", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
uuid = { version = "1", features = ["v4"] }
data-url = "0.3"
mermaid-rs-renderer = { version = "*", default-features = false }
