app = "hey-boss-mobile-kamil"
primary_region = "ord"
[build]
  dockerfile = "Dockerfile"
[env]
  PORT = "8787"
  PUBLIC_ORIGIN = "https://hey-boss-mobile-kamil.fly.dev"
[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/healthz"
[[vm]]
  memory = "256mb"
  cpus = 1
  cpu_kind = "shared"
