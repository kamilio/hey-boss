[package]
name = "hey-boss-secrets"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Local encrypted secret records for Hey Boss tools"

[dependencies]
age = { version = "0.11", default-features = false }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rusqlite = { version = "0.40.2", features = ["bundled"] }
hey-boss-sync = { path = "../hey-boss-sync" }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
