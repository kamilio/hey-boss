[package]
name = "hey-boss-sync"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
rusqlite = { version = "0.40.2", features = ["bundled", "load_extension"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
