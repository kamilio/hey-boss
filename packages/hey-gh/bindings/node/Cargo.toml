[package]
name = "hey-gh-node"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
hey-gh = { path = "../.." }
napi = { version = "3.12.6", features = ["napi8", "tokio_rt", "serde-json"] }
napi-derive = "3"
serde = "1"
serde_json = "1"
url = "2"

[build-dependencies]
napi-build = "2"
