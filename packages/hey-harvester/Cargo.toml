[package]
name = "hey-harvester"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Machine maintenance and safe cleanup with a terminal dashboard"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.28"
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2.189"
sha2 = "0.10"

[dev-dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
