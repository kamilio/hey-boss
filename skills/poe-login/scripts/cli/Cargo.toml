[package]
name = "poe-login"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
html-escape = "0.2"
jiff = "0.2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
