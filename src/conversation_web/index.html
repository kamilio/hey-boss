<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Conversations</title><meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#eef0f4">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#11151d">
<meta name="apple-mobile-web-app-capable" content="yes"><link rel="apple-touch-icon" href="/icon.png">
<link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/components.css"><link rel="stylesheet" href="/app.css"><script defer src="/app.js"></script>
</head><body>
<header class="app-header"><div class="conversation-bar">
  <div class="brand"><img src="/brand.png" alt="" width="30" height="30"><span>Hey Boss</span></div>
  <span class="header-divider" aria-hidden="true"></span><strong>Conversations</strong>
  <button class="icon-button" id="history" title="Chat history" aria-label="Chats"><svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="M9 4v16"/></svg></button>
  <button class="icon-button" id="fresh" title="New conversation" aria-label="New conversation"><svg viewBox="0 0 24 24"><path d="M13 5H6a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3v-7M11 15l1-4 8-8 3 3-8 8z"/></svg></button>
</div></header>
<main id="timeline">
  <div id="empty" hidden><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3 14v4m5-9v14m5-20v26m6-22v18m5-14v10m5-8v6"/></svg><h1></h1><p></p></div>
  <button class="button" id="earlier" hidden>Earlier messages</button><div id="messages"></div><button class="button" id="latest" hidden>Back to latest</button>
</main>
<footer class="glass">
  <section hidden id="approval"><pre></pre><button class="button" id="decline">Decline</button> <button class="button primary" id="allow">Allow once</button></section>
  <p id="notice" role="alert"></p><div id="caption"></div>
  <form id="composer"><input id="draft" autocomplete="off" placeholder="Message Hey Boss…" aria-label="Message">
    <button class="icon-button" aria-label="Send message"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="currentColor" stroke="none"/><path d="M12 17V7m-4 4 4-4 4 4" stroke="white"/></svg></button>
  </form>
  <div class="controls">
    <button id="talk" aria-label="Start voice" disabled><span><svg viewBox="0 0 16 18"><path d="M3 6v6m5-10v14m5-11v9"/></svg><svg id="speaker" viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3zM16 8q4 4 0 8m3-11q7 7 0 14"/></svg><svg id="levels" viewBox="0 0 54 24"><path/></svg><b id="voice-label">Start voice</b></span></button>
    <button class="button" hidden id="mute">Mute mic</button><button class="button" hidden id="pause">Pause reply</button>
    <span role="status" id="status">Connecting…</span>
    <button class="button" hidden id="interrupt">Interrupt</button><button class="button" hidden id="finish">Send now</button>
  </div>
</footer>
<dialog class="glass" id="chats" aria-labelledby="chatsTitle"><div class="bar"><h2 id="chatsTitle">Chats</h2><button class="button" id="close">Done</button></div><div id="list"></div><button class="button" id="more" hidden>More chats</button></dialog>
<dialog class="glass" id="pair" aria-labelledby="pairTitle"><h2 id="pairTitle">Pair with your Mac</h2><p>Enter the pairing code from your laptop.</p><form id="pairForm"><input class="text-input" id="code" type="password" aria-label="Pairing code" autocomplete="current-password" required><button class="button primary">Pair</button></form><p role="alert" id="pairError"></p></dialog>
</body></html>
