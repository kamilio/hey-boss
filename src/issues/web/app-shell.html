    <header class="app-header">
      <div class="header-inner">
        <a class="brand" href="/" aria-label="Hey Boss"
          ><img src="/icon.png" alt="" width="30" height="30" /><span
            >Hey Boss</span
          ></a
        >
        <span class="header-divider" aria-hidden="true"></span>
        <div class="project-control">
          <button
            id="project-trigger"
            class="project-trigger"
            aria-haspopup="dialog"
            aria-expanded="false"
            aria-controls="project-menu"
          >
            <span class="project-glyph" data-icon="folder"></span
            ><span id="project-name">Projects</span
            ><span data-icon="chevrons"></span>
          </button>
          <div
            id="project-menu"
            class="popover project-menu"
            role="dialog"
            aria-label="Switch project"
            hidden
          >
            <div class="popover-search">
              <span data-icon="search"></span
              ><input
                id="project-search"
                type="search"
                aria-label="Find a project"
                placeholder="Find a project…"
                autocomplete="off"
              />
            </div>
            <div class="menu-caption" id="project-sort-label">
              RECENT ACTIVITY
            </div>
            <div id="project-options"></div>
            <button
              id="toggle-hidden-projects"
              class="add-project"
              type="button"
            >
              Hidden projects
            </button>
<!--project-action-->
          </div>
        </div>
        <div class="header-right">
<button id="quick-issue-open" class="icon-button" type="button" aria-label="Quick add issue" title="Quick add issue (⌘⇧K / Ctrl+Shift+K)" aria-keyshortcuts="Meta+Shift+K Control+Shift+K"><span data-icon="plus"></span></button>
<!--header-actions-->
          <span class="connection" id="connection" role="status"
            ><i></i><span>Connected</span></span
          >
<!--profile-->
        </div>
      </div>
    </header>
    <nav class="app-navigation" aria-label="Main navigation">
      <div class="navigation-inner">
        <a id="nav-inbox" href="/#view=inbox"
          ><span data-icon="inbox"></span>Inbox<span
            id="inbox-unread"
            class="tab-count"
            hidden
          ></span
        ></a>
        <a id="nav-issues" href="/"><span data-icon="issue"></span>Issues</a>
        <a id="nav-workers" href="/agents"<!--workers-current-->><span data-icon="user"></span>Agents</a>
        <a id="nav-artifacts" href="/artifacts"><span data-icon="docs"></span>Artifacts</a>
        <a id="nav-mindmaps" href="/mm"<!--mindmap-current-->><span data-icon="subtasks"></span>Mindmaps</a>
      </div>
    </nav>

    <dialog id="quick-issue-dialog" aria-label="Quick add issue">
      <form id="quick-issue-form">
        <div class="quick-issue-entry">
          <span data-icon="issue"></span>
          <input id="quick-issue-title" aria-label="Issue title" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="quick-issue-projects" aria-describedby="quick-issue-context" placeholder="Issue title… @project to switch" autocomplete="off" maxlength="1024" />
          <button id="quick-issue-close" type="button" class="icon-button" aria-label="Close quick add"><span data-icon="x"></span></button>
        </div>
        <div id="quick-issue-project-picker" hidden>
          <div class="quick-issue-project-heading">Switch project <span>Choose where this issue belongs</span></div>
          <div id="quick-issue-projects" role="listbox" aria-label="Projects"></div>
          <p id="quick-issue-project-status" role="status"></p>
        </div>
        <p id="quick-issue-error" role="alert" hidden></p>
        <div class="quick-issue-footer">
          <span id="quick-issue-context" role="status"></span>
          <label class="task-kind-choice" for="quick-issue-kind">Task <select id="quick-issue-kind" title="Plan and Research produce linked artifacts"><option value="implement">Implement</option><option value="plan">Plan</option><option value="research">Research</option></select></label>
          <label class="issue-placement" title="Toggle add to bottom (⌘⇧B / Ctrl+Shift+B)"><input type="checkbox" id="quick-issue-bottom" aria-keyshortcuts="Meta+Shift+B Control+Shift+B" /> Add to bottom <kbd>⌘⇧B</kbd></label>
          <button id="quick-issue-submit" class="button" type="submit" disabled>Create ↵</button>
        </div>
      </form>
    </dialog>
    <div id="quick-issue-status" role="status" hidden></div>
