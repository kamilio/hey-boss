<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Code Reviews · Hey Boss</title>
    <link rel="icon" href="/icon.png" />
    <link rel="stylesheet" href="/components.css" />
    <link rel="stylesheet" href="/app.css" />
    <link rel="stylesheet" href="/merged-prs.css" />
    <link rel="stylesheet" href="/code-reviews.css" />
    <script src="/routes.js" defer></script>
    <script src="/components.js" defer></script>
    <script src="/quick-issue.js" defer></script>
    <script src="/code-reviews.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#reviews-main">Skip to code reviews</a
    ><!--app-shell-->
    <main id="reviews-main" tabindex="-1">
      <header class="page-heading">
        <h1>Code Reviews <span class="heading-count" id="reviews-count"></span></h1>
        <button id="reviews-refresh" class="button" type="button">Refresh</button>
      </header>
      <div id="reviews-error" role="alert" hidden></div>
      <div id="reviews-list" aria-label="Review queue"></div>
      <p id="reviews-status" role="status" aria-live="polite"></p>
    </main>
  </body>
</html>
