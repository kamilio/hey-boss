<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Commit review · Hey Boss</title>
  <link rel="icon" href="/icon.png">
  <link rel="stylesheet" href="/components.css">
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/commit-review.css">
  <script src="/routes.js" defer></script>
  <script src="/components.js" defer></script>
  <script type="module" src="/commit-review.js"></script>
</head>
<body>
  <a class="skip-link" href="#review-main">Skip to commit review</a>
  <header class="app-header">
    <div class="header-inner">
      <a class="brand" href="/"><img src="/icon.png" alt="" width="30" height="30">Hey Boss</a>
      <span class="header-divider" aria-hidden="true"></span>
      <span class="review-label">Commit review</span>
    </div>
  </header>
  <main id="review-main" tabindex="-1">
    <p role="status" id="loading">Loading commit review…</p>
    <div id="review" hidden>
      <a class="back-link" id="task-title"><span data-icon="arrow-left"></span><span></span></a>
      <section class="task-strip" aria-label="Task actions">
        <strong>Task</strong><span id="task-state"></span><span id="task-owner"></span>
        <div class="task-actions">
          <button class="button small" id="rework">Reopen and assign to me</button>
          <button class="button small" id="assign-me">Assign to me</button>
          <button class="button small" id="make-ready">Mark ready</button>
          <button class="button small" id="unassign">Unassign</button>
          <button class="icon-button" id="refresh-task" title="Refresh task status" aria-label="Refresh task status"><span data-icon="refresh"></span></button>
        </div>
      </section>
      <div id="status" role="status"></div><div id="review-error" role="alert" hidden></div>
      <header>
        <div class="eyebrow">Commit <code id="commit-sha"></code></div>
        <div id="message-reader">
          <div class="detail-top"><h1></h1></div>
          <div class="review-byline">
            <span id="author"></span><time id="authored"></time>
            <div class="message-actions">
              <button class="button small" id="edit-message">Edit commit message</button>
              <button class="button small" id="download-patch">Download patch</button>
            </div>
          </div>
          <details id="full-message"><summary>Full commit message</summary><div id="message-body" class="markdown"></div></details>
        </div>
        <form id="message-form" hidden>
          <label for="commit-message">Commit message</label>
          <textarea id="commit-message" required maxlength="65536" spellcheck="false"></textarea>
          <div class="message-actions"><span id="message-error" role="alert"></span><button type="button" class="button" id="cancel-message">Cancel</button><button type="submit" class="button primary">Save message</button></div>
        </form>
      </header>
      <div class="changes-heading">
        <h2>Changed files <span class="heading-count" id="file-count"></span></h2>
        <span id="count"></span>
        <div class="git-layout" role="group" aria-label="Diff layout">
          <button type="button" data-layout="unified" class="active" aria-pressed="true">Unified</button><button type="button" data-layout="split" aria-pressed="false">Split</button>
        </div>
      </div>
      <div id="files"></div>
    </div>
  </main>
  <dialog id="reopen-dialog" aria-labelledby="reopen-title">
    <form id="reopen-form">
      <header class="dialog-heading"><h2 id="reopen-title">Reopen task</h2></header>
      <div class="dialog-content">
        <label class="field-label" for="reopen-comment">Comment <span>optional</span></label>
        <textarea id="reopen-comment" rows="5" autofocus></textarea>
        <p id="reopen-error" class="form-error" role="alert" hidden></p>
      </div>
      <footer class="dialog-footer">
        <span><kbd>⌘</kbd><kbd>Enter</kbd> to reopen</span>
        <div><button type="button" class="button" id="reopen-cancel">Cancel</button><button type="submit" class="button primary">Reopen task</button></div>
      </footer>
    </form>
  </dialog>
</body>
</html>
