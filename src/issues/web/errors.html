<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Errors · Hey Boss</title>
    <link rel="icon" href="/icon.png" />
    <link rel="stylesheet" href="/components.css" />
    <link rel="stylesheet" href="/app.css" />
    <link rel="stylesheet" href="/errors.css" />
    <script src="/components.js" defer></script>
    <script src="/quick-issue.js" defer></script>
    <script src="/errors.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#errors-main">Skip to errors</a><!--app-shell-->
    <main id="errors-main" tabindex="-1">
      <header class="page-heading">
        <div>
          <p class="eyebrow">DIAGNOSTICS</p>
          <h1>Errors <span id="families" class="heading-count"></span></h1>
          <p class="page-description">
            Error groups, ordered by frequency in the last 24 hours.
          </p>
        </div>
        <button id="collection" class="button">Loading…</button>
      </header>
      <p id="errors-alert" role="alert" hidden></p>
      <div class="toolbar">
        <label class="search-field"
          ><span data-icon="search"></span
          ><input
            id="error-search"
            type="search"
            placeholder="Find an error…"
            aria-label="Find an error" /></label
        ><span class="error-sort">Most frequent · last 24 hours</span
        ><button class="icon-button refresh" id="refresh" aria-label="Refresh errors" title="Refresh errors"><span data-icon="refresh"></span></button>
      </div>
      <p id="errors-updated" class="error-updated"></p>
      <section class="issue-panel glass" aria-label="Error groups">
        <div id="error-rows"></div>
        <p id="errors-status" role="status">Loading error inbox…</p>
      </section>
      <dialog id="error-dialog" aria-labelledby="error-title">
        <div class="dialog-heading"><div><span class="dialog-eyebrow">ERROR EVIDENCE</span><h2 id="error-title">Error details</h2></div><button type="button" class="icon-button" id="close-error" aria-label="Close error details"><span data-icon="x"></span></button></div>
        <div id="error-detail" class="dialog-content error-detail" aria-live="polite"></div>
      </dialog>
      <footer class="page-footer">
        <span>Observed logs may be sampled upstream. Counts are not unique requests. · Samples kept for 30 days.</span>
      </footer>
    </main>
  </body>
</html>
