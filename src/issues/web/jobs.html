<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light dark"><title>Jobs · Hey Boss</title><link rel="icon" href="/icon.png"><link rel="stylesheet" href="/components.css"><link rel="stylesheet" href="/jobs.css"><script src="/routes.js" defer></script><script src="/components.js" defer></script><script src="/quick-issue.js" defer></script><script src="/jobs-calendar.js" defer></script><script src="/jobs.js" defer></script></head>
<body><a class="skip-link" href="#jobs-main">Skip to jobs</a><!--app-shell-->
<main id="jobs-main" tabindex="-1">
 <div class="page-heading jobs-heading"><div><h1>Jobs <span id="jobs-count" class="heading-count"></span></h1><p class="page-description">Recurring work, on your schedule.</p></div><button class="button primary" id="job-new" type="button" disabled><span data-icon="plus"></span>New job</button></div>
 <div id="jobs-feedback"><div id="jobs-error" class="jobs-message error" role="alert" hidden></div><div id="jobs-retry" class="jobs-message" hidden><span>The result is unconfirmed. Retry the same request safely.</span><button class="button" id="job-retry" type="button">Retry request</button></div></div>
 <div class="jobs-topbar"><div class="jobs-views" role="group" aria-label="Jobs view"><button class="button" id="jobs-view-list" aria-pressed="true"><span data-icon="sort"></span>List</button><button class="button" id="jobs-view-calendar" aria-pressed="false"><span data-icon="clock"></span>Calendar</button></div><div class="jobs-service"><span class="jobs-service-dot" aria-hidden="true"></span><span id="jobs-service" role="status">Checking availability…</span></div></div>
 <section id="jobs-calendar" aria-label="Jobs calendar" hidden></section>
 <div class="jobs-layout"><section class="jobs-sidebar" aria-label="Scheduled jobs">
  <div class="jobs-toolbar"><div class="jobs-filters" role="group" aria-label="Schedule status"><button type="button" data-filter="all" aria-pressed="true">All jobs <span></span></button><button type="button" data-filter="enabled" aria-pressed="false">Enabled <span></span></button><button type="button" data-filter="disabled" aria-pressed="false">Disabled <span></span></button></div><div class="jobs-tools"><label class="jobs-search"><span data-icon="search"></span><input id="jobs-search" type="search" aria-label="Search jobs" placeholder="Search jobs"></label><button id="jobs-refresh" class="icon-button" type="button" aria-label="Refresh jobs"><span data-icon="refresh"></span></button></div></div>
  <div class="jobs-columns" aria-hidden="true"><span>Job</span><span>Schedule</span><span>Last run</span><span>Status</span></div>
  <p id="jobs-status" role="status">Loading jobs…</p><div id="jobs-list"></div><div class="jobs-list-footer"><label><input id="jobs-deleted" type="checkbox"> Show deleted</label><button id="jobs-more" class="button" type="button" hidden>Show more jobs</button></div>
 </section></div>
 <dialog id="job-dialog" aria-labelledby="job-panel-title"><div class="job-dialog-bar"><span>Job details</span><button class="icon-button" id="job-close" type="button" aria-label="Close job details"><span data-icon="x"></span></button></div><div id="job-dialog-feedback"></div><section id="job-panel" class="job-panel" aria-label="Job details"></section></dialog>
</main></body></html>
