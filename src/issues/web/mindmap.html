<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light dark">
<title>Mindmaps · Hey Boss</title><link rel="icon" href="/icon.png"><link rel="stylesheet" href="/components.css"><link rel="stylesheet" href="/mindmap.css"><script src="/components.js" defer></script><script src="/quick-issue.js" defer></script><script src="/mindmap-map.js" defer></script>
<script src="/attachments.js" defer></script><script src="/artifacts.js" defer></script><script src="/mindmap.js" defer></script><link rel="stylesheet" href="/artifacts.css">
<link rel="stylesheet" href="/attachments.css">
</head>
<body>
<a class="skip-link" href="#outline">Skip to outline</a>
<!--app-shell-->
<main id="main" tabindex="-1">
<div class="page-heading"><div><div class="eyebrow"><span data-icon="folder"></span><span id="title">Your project</span></div><h1>Mindmaps</h1><p class="page-description" id="caption">Topics, work and dependencies in one map.</p></div></div>
<div class="toolbar"><div class="search"><label for="search">Search mindmap</label><div class="search-input search-field"><span data-icon="search"></span><input id="search" type="search" placeholder="Topics, issues, PRs or relationships…" autocomplete="off" aria-describedby="search-status"><div id="search-navigation" hidden><button id="search-previous" class="icon-button" type="button" aria-label="Previous match" title="Previous match (Shift+Enter)">‹</button><span id="search-status" role="status" aria-live="polite"></span><button id="search-next" class="icon-button" type="button" aria-label="Next match" title="Next match (Enter)">›</button></div></div></div><div class="actions"><button class="button" id="expand" type="button">Expand all</button><button class="button" id="collapse" type="button">Collapse all</button><button class="button" id="refresh" type="button">Refresh</button></div></div>
<p id="error" role="alert" hidden></p><p id="inbox-warning" role="status" hidden></p>
<section class="panel glass" aria-label="Project mindmap"><div class="panel-heading"><div class="view-switch" role="group" aria-label="Mindmap view"><button id="view-map" type="button" aria-pressed="true">Map</button><button id="view-outline" type="button" aria-pressed="false">Outline</button></div><span id="count"></span></div><div id="map-panel"><div class="map-controls" role="group" aria-label="Map navigation"><button id="map-fit" type="button">Fit</button><button id="map-out" type="button" aria-label="Zoom out">−</button><output id="map-zoom" aria-label="Zoom">100%</output><button id="map-in" type="button" aria-label="Zoom in">+</button></div><div id="mindmap" tabindex="0" role="region" aria-label="Interactive mindmap" aria-describedby="map-help"></div><button id="map-overview" type="button" aria-label="Center map from overview" title="Click to navigate the map"><canvas width="160" height="96" aria-hidden="true"></canvas></button><p id="map-help">Drag to pan · Pinch or Ctrl+scroll to zoom · Select a topic for details</p><aside id="map-inspector" aria-label="Selected topic" hidden><div class="inspector-heading"><button id="close-inspector" type="button" aria-label="Close topic details">×</button></div><div id="map-details"></div></aside></div><div id="outline" tabindex="-1" hidden><p class="empty">Loading mindmap…</p></div></section>
<footer class="page-footer"><span id="revision"></span><span class="footer-product">Read-only viewer · Author with <code>hey-boss mm</code></span></footer>
</main>
</body></html>
