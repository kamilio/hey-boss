[package]
name = "terminal-checks"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
terminal-pilot-rust = { git = "https://github.com/poe-platform/poe-code", branch = "main" }
terminal-png-rust = { git = "https://github.com/poe-platform/poe-code", branch = "main" }
tempfile = "3"
serde_json = "1"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
libc = "0.2"

[profile.dev.package.terminal-png-rust]
opt-level = 2

[workspace]
