[package]
name = "hey-boss-worker-tui"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Responsive terminal dashboard and reusable UI library for hey-boss workers"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.28"
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
serde_json = "1"
ctrlc = { version = "3.5", features = ["termination"] }
libc = "0.2"

[[bin]]
name = "hey-boss-worker-tui"
path = "src/main.rs"
